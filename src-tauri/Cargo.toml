[package]
name = "astra-core"
version = "1.2.0"
description = "Astra-Core.sys — Personal AI Waifu & Desktop Companion"
authors = ["Adidtia-Kaito"]
edition = "2021"

[lib]
name = "astra_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
